name: Build personalized Home Server Installer ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-amd64:
    name: Build personalized amd64 ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve latest Home Server Installer release
        id: installer_release
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            https://api.github.com/repos/home-server-project/home-server-installer/releases/latest)"

          tag="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' <<<"$release_json")"
          if [[ -z "$tag" ]]; then
            echo "error: latest Home Server Installer release did not contain a tag" >&2
            exit 1
          fi

          echo "Resolved Home Server Installer release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out released Home Server Installer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: home-server-project/home-server-installer
          ref: ${{ steps.installer_release.outputs.tag }}
          path: installer
          persist-credentials: false

      - name: Validate SSH public key secret
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${SSH_PUBLIC_KEY:-}" ]]; then
            echo "error: SSH_PUBLIC_KEY repository secret is required" >&2
            echo "Add it under Settings -> Secrets and variables -> Actions before running this workflow." >&2
            exit 1
          fi

          if grep -qi 'PRIVATE KEY' <<<"$SSH_PUBLIC_KEY"; then
            echo "error: SSH_PUBLIC_KEY appears to contain private-key material; refusing to continue" >&2
            exit 1
          fi

          if [[ "$(printf '%s\n' "$SSH_PUBLIC_KEY" | sed '/^[[:space:]]*$/d' | wc -l)" -ne 1 ]]; then
            echo "error: SSH_PUBLIC_KEY must contain exactly one public key line" >&2
            exit 1
          fi

          key_type="${SSH_PUBLIC_KEY%% *}"
          case "$key_type" in
            ssh-ed25519|ssh-rsa|ecdsa-sha2-*|sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-nistp256@openssh.com) ;;
            *)
              echo "error: SSH_PUBLIC_KEY does not start with a supported OpenSSH public-key type" >&2
              exit 1
              ;;
          esac

          key_file="$RUNNER_TEMP/home-server-installer.pub"
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$key_file"
          chmod 0600 "$key_file"
          ssh-keygen -l -f "$key_file" >/dev/null

          echo "SSH public key validated."

      - name: Set up Go from released installer
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
          check-latest: true

      - name: Build released installer binary
        working-directory: installer
        shell: bash
        env:
          INSTALLER_TAG: ${{ steps.installer_release.outputs.tag }}
        run: |
          set -euo pipefail

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -buildvcs=false \
            -ldflags="-s -w -X main.version=${INSTALLER_TAG}" \
            -o home-server-installer-linux-amd64 \
            ./cmd/knuckle

          ./home-server-installer-linux-amd64 --version

      - name: Install FCOS ISO build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y xorriso mtools cpio systemd-boot-efi

          sudo tee /usr/local/bin/coreos-installer >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm \
            --security-opt label=disable \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            quay.io/coreos/coreos-installer:release "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/coreos-installer
          coreos-installer --version

      - name: Build personalized Home Server Installer ISO
        working-directory: installer
        shell: bash
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          chmod +x ./scripts/build-fcos-iso.sh
          ./scripts/build-fcos-iso.sh \
            --stream stable \
            --arch amd64 \
            --binary ./home-server-installer-linux-amd64 \
            --ssh-key "$SSH_PUBLIC_KEY"

          cp output/knuckle-fcos-installer-stable-amd64.iso \
            ../home-server-ucore-installer-amd64.iso

      - name: Create checksum and build information
        shell: bash
        env:
          INSTALLER_TAG: ${{ steps.installer_release.outputs.tag }}
        run: |
          set -euo pipefail

          sha256sum home-server-ucore-installer-amd64.iso \
            > home-server-ucore-installer-amd64.iso.sha256

          installer_sha="$(git -C installer rev-parse HEAD)"
          cat > build-info.txt <<EOF
          Home Server uCore Builder
          Installer release: ${INSTALLER_TAG}
          Installer commit: ${installer_sha}
          Fedora CoreOS stream: stable
          Architecture: amd64
          Builder repository: ${GITHUB_REPOSITORY}
          Builder workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload personalized ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: home-server-ucore-installer-amd64
          path: |
            home-server-ucore-installer-amd64.iso
            home-server-ucore-installer-amd64.iso.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 1
